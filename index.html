<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TableSync | AI Dinner Matching</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">T</span>
          <div>
            <strong>TableSync</strong>
            <span>AI Dinner Ops</span>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="reset-demo" type="button" title="デモデータを復元">↺</button>
          <button class="secondary-button" id="export-json" type="button">JSON</button>
          <button class="primary-button" id="export-csv" type="button">CSV</button>
        </div>
      </header>

      <main class="workspace">
        <section class="surface intake">
          <div class="section-head">
            <div>
              <p class="eyebrow">Participants</p>
              <h1>参加者管理</h1>
            </div>
            <span class="count-pill" id="participant-count">0人</span>
          </div>

          <form id="participant-form" class="participant-form">
            <label>
              名前
              <input name="name" type="text" placeholder="例: 佐藤 はるか" required />
            </label>
            <label>
              エリア
              <select name="area">
                <option>渋谷</option>
                <option>新宿</option>
                <option>銀座</option>
                <option>日本橋</option>
              </select>
            </label>
            <label>
              目的
              <select name="purpose">
                <option value="friends">友人づくり</option>
                <option value="founders">起業家交流</option>
                <option value="career">キャリア相談</option>
                <option value="local">近所のつながり</option>
              </select>
            </label>
            <label>
              予算
              <select name="budget">
                <option value="4500">4,500円</option>
                <option value="6500">6,500円</option>
                <option value="9000">9,000円</option>
              </select>
            </label>
            <label>
              会話量
              <select name="vibe">
                <option value="calm">落ち着き</option>
                <option value="balanced" selected>バランス</option>
                <option value="lively">にぎやか</option>
              </select>
            </label>
            <label>
              食事条件
              <select name="diet">
                <option value="none">なし</option>
                <option value="vegetarian">ベジ対応</option>
                <option value="no-pork">豚肉なし</option>
                <option value="non-alcohol">ノンアル</option>
              </select>
            </label>
            <label class="wide">
              業界
              <input name="industry" type="text" placeholder="例: デザイン / SaaS / 医療" required />
            </label>
            <fieldset class="tag-picker wide">
              <legend>興味タグ</legend>
              <label><input type="checkbox" name="tags" value="AI" />AI</label>
              <label><input type="checkbox" name="tags" value="旅行" />旅行</label>
              <label><input type="checkbox" name="tags" value="スタートアップ" />スタートアップ</label>
              <label><input type="checkbox" name="tags" value="食" />食</label>
              <label><input type="checkbox" name="tags" value="映画" />映画</label>
              <label><input type="checkbox" name="tags" value="投資" />投資</label>
              <label><input type="checkbox" name="tags" value="健康" />健康</label>
              <label><input type="checkbox" name="tags" value="地域" />地域</label>
            </fieldset>
            <button class="primary-button wide" type="submit">参加者を追加</button>
          </form>

          <div class="list-head">
            <span>待機リスト</span>
            <button class="text-button" id="clear-participants" type="button">クリア</button>
          </div>
          <div class="participant-list" id="participant-list"></div>
        </section>

        <section class="surface matching">
          <div class="section-head">
            <div>
              <p class="eyebrow">Matching</p>
              <h2>水曜ディナー</h2>
            </div>
            <button class="primary-button" id="generate-matches" type="button">マッチング生成</button>
          </div>

          <div class="event-grid">
            <label>
              開催日
              <input id="event-date" type="date" />
            </label>
            <label>
              開催エリア
              <select id="event-area">
                <option>渋谷</option>
                <option>新宿</option>
                <option>銀座</option>
                <option>日本橋</option>
              </select>
            </label>
            <label>
              人数
              <select id="group-size">
                <option value="4">4人</option>
                <option value="5" selected>5人</option>
                <option value="6">6人</option>
              </select>
            </label>
            <label>
              参加費
              <select id="platform-fee">
                <option value="900">900円</option>
                <option value="1200" selected>1,200円</option>
                <option value="1800">1,800円</option>
              </select>
            </label>
          </div>

          <div class="metrics" aria-label="イベント指標">
            <div>
              <span>成立テーブル</span>
              <strong id="metric-groups">0</strong>
            </div>
            <div>
              <span>平均相性</span>
              <strong id="metric-score">0</strong>
            </div>
            <div>
              <span>売上見込</span>
              <strong id="metric-revenue">0円</strong>
            </div>
          </div>

          <div class="table-map" aria-label="テーブル配置">
            <div class="venue-bar">host desk</div>
            <div class="table-node" data-table="A">A</div>
            <div class="table-node" data-table="B">B</div>
            <div class="table-node" data-table="C">C</div>
            <div class="table-node" data-table="D">D</div>
          </div>

          <div class="match-results" id="match-results">
            <div class="empty-state">
              <strong>未生成</strong>
              <span>参加者を追加してマッチングを生成</span>
            </div>
          </div>
        </section>

        <aside class="side-stack">
          <section class="surface">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Venues</p>
                <h2>店舗候補</h2>
              </div>
            </div>
            <div class="restaurant-list" id="restaurant-list"></div>
          </section>

          <section class="surface">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Ops</p>
                <h2>当日運営</h2>
              </div>
            </div>
            <div class="ops-list">
              <div><span>72h前</span><strong>事前決済確認</strong></div>
              <div><span>24h前</span><strong>店舗へ人数確定</strong></div>
              <div><span>3h前</span><strong>参加者へ集合案内</strong></div>
              <div><span>翌日</span><strong>レビュー回収</strong></div>
            </div>
            <textarea id="message-copy" rows="8" readonly></textarea>
          </section>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
